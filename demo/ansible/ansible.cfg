# H6: configuracion de Ansible para la estacion. Se corre desde esta carpeta:
#   cd ~/goys-tp4-integrador/demo/ansible && ansible-playbook defensa.yml --ask-vault-pass
[defaults]
inventory = inventario.yml
# Sin .retry ni estadisticas que ensucien el repo
retry_files_enabled = False
# La llave del EDGE se acepta una sola vez a mano (runbook, paso 3): sin eso no conecta
host_key_checking = True
# Salida legible en la feria
stdout_callback = default
callback_result_format = yaml

[persistent_connection]
# Los CHR emulados responden lento cuando GNS3 tiene los 7 routers prendidos
connect_timeout = 30
command_timeout = 30
